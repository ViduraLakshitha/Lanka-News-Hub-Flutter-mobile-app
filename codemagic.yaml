workflows:
  ios-workflow:
    name: iOS Build & Package
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: mobile_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Install Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r LankaNewsHub_Release.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
      - mobile_app/build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/*.app
      - mobile_app/build/ios/iphoneos/*.app

