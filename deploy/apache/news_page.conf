# ==============================================================================
# Lanka News Hub — Production Apache 2.4 Virtual Host Configuration
# Server: Linux (Ubuntu / Debian / CentOS / CloudLinux)
# Runtime: PHP 8.2 via mod_proxy_fcgi
# ==============================================================================

<VirtualHost *:80>
    ServerName news.liontech.lk
    ServerAlias www.news.liontech.lk sinhala.news.liontech.lk tamil.news.liontech.lk

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName news.liontech.lk
    ServerAlias www.news.liontech.lk sinhala.news.liontech.lk tamil.news.liontech.lk

    # STRICT Document Root: Points ONLY to public/
    DocumentRoot /var/www/news_page/current/public

    # SSL / TLS Hardening
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/news.example.lk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/news.example.lk/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Strict Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # Document Root Directory Permissions
    <Directory /var/www/news_page/current/public>
        Options -Indexes +FollowSymLinks -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Strict Script Execution Lockdown on Uploads Directory
    <Directory /var/www/news_page/current/public/uploads>
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php|phtml|phar|cgi|pl|py|sh|shtml|asp|aspx|exe|dll|jsp)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <IfModule mod_php8.c>
            php_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .phar .cgi .pl .py .sh
        SetHandler default-handler
    </Directory>

    # Block sensitive non-public directories
    <DirectoryMatch "^/var/www/news_page/current/(app|config|database|storage|bin|tests)">
        Require all denied
    </DirectoryMatch>

    # PHP-FPM FastCGI Handler
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/news_page_error.log
    CustomLog ${APACHE_LOG_DIR}/news_page_access.log combined
</VirtualHost>
