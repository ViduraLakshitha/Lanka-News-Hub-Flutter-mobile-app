# ==============================================================================
# Lanka News Hub — Production Nginx Virtual Host Configuration
# Server: Linux (Ubuntu 22.04 / 24.04 / Debian 12 / RHEL 9)
# Runtime: PHP-FPM 8.2+
# ==============================================================================

# 1. HTTP to HTTPS Strict Redirection
server {
    listen 80;
    listen [::]:80;
    server_name news.liontech.lk www.news.liontech.lk sinhala.news.liontech.lk tamil.news.liontech.lk;

    # Let's Encrypt ACME challenge directory
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name news.liontech.lk www.news.liontech.lk sinhala.news.liontech.lk tamil.news.liontech.lk;

    # STRICT Document Root: Points ONLY to public directory
    root /var/www/news_page/current/public;
    index index.php;

    # SSL / TLS Hardening
    ssl_certificate /etc/letsencrypt/live/news.example.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.lk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/news.example.lk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers (Web Application Defense)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Character Encoding
    charset utf-8;

    # Logging
    access_log /var/log/nginx/news_page_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/news_page_error.log warn;

    # Request size limits (Matches PHP post_max_size and upload_max_filesize)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip / Deflate Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/ttf font/otf;

    # 3. Main Application Entry Point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Strict Script Execution Lockdown on Uploads Directory
    location ^~ /uploads/ {
        # Deny execution of any PHP, shell, or executable files inside uploads
        location ~* \.(php|phtml|phar|cgi|pl|py|sh|shtml|asp|aspx|exe|dll|jsp)$ {
            deny all;
            return 403;
        }
        # Serve static media with long browser cache
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 5. Static Assets Caching (CSS, JS, Fonts, Images)
    location ~* \.(css|js|webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 6. Hidden Files & Sensitive Directories Lockdown
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage|database|app|config|bin|tests)/ {
        deny all;
        return 404;
    }

    # 7. PHP-FPM FastCGI Handler
    location ~ \.php$ {
        # Mitigate httpoxy vulnerability
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Timeouts and buffer sizes
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors off;
    }
}
