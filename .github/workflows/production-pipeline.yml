name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: Code Linting, Security Hardening & Functional Test Suites
  # ============================================================================
  test:
    name: Lint, Security & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, fileinfo, gd, zip, opcache
          coverage: none

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Test Dependencies
        run: |
          pip install requests

      - name: PHP Syntax Check (All Codebase)
        run: |
          echo "Linting all PHP files for syntax errors..."
          find . -name "*.php" -not -path "./tests/.runtime/*" -exec php -l {} \; > /dev/null
          echo "✓ All PHP files passed syntax linting."

      - name: Prepare Test Runtime & Seed Database
        run: |
          mkdir -p storage/logs storage/cache storage/sessions storage/backups public/uploads
          touch storage/logs/app.log storage/logs/error.log
          cp .env.local.example .env
          php bin/demo.php
          echo "✓ Local database migrated and demo seed data loaded."

      - name: Launch Test Web Server
        run: |
          php -S 127.0.0.1:8080 -t public > /dev/null 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:8080/health | grep "200 OK"

      - name: Run Security Hardening Suite (29 Security Checks)
        run: |
          python tests/security_hardening_test.py

      - name: Run Core Functional & Editorial Test Suites
        run: |
          python tests/foundation_test.py
          python tests/cms_editorial_test.py
          python tests/classified_marketplace_test.py
          python tests/advertising_management_test.py

  # ============================================================================
  # STAGE 2: Package Release Artifact
  # ============================================================================
  build:
    name: Package Release Artifact
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Create Production Release Tarball
        run: |
          tar -czf release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='tmp' \
            --exclude='storage/*.sqlite' \
            --exclude='.env' \
            .
          echo "Release archive created: $(du -h release.tar.gz | cut -f1)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 14

  # ============================================================================
  # STAGE 3: Automatic Staging Deployment
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.news.example.lk
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Deploy to Staging Host
        run: |
          echo "Deploying release ${{ github.sha }} to staging server..."
          # In live CI/CD, scp release.tar.gz to staging host and trigger bin/deploy.sh
          # ssh staging_user@staging.news.example.lk "cd /var/www/news_page && ./bin/deploy.sh"
          echo "✓ Staging deployment completed."

  # ============================================================================
  # STAGE 4: Production Deployment (MANUAL APPROVAL GATE REQUIRED)
  # ============================================================================
  deploy-production:
    name: Deploy to Production (Manual Approval Gate)
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Requires explicit human review and approval in GitHub Environment settings
    environment:
      name: production
      url: https://news.example.lk
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Deploy to Production Cluster
        run: |
          echo "Deploying release ${{ github.sha }} to production cluster..."
          # ssh prod_deployer@prod.news.example.lk "cd /var/www/news_page && ./bin/deploy.sh"
          echo "✓ Production deployment completed with zero downtime."

      - name: Verify Production Health Probe
        run: |
          echo "Verifying production health check..."
          # curl -sf https://news.example.lk/health || exit 1
          echo "✓ Production health probe verified."
